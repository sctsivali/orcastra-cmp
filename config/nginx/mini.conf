# nginx for the mini (client-cert) Orcastra deployment.
# Mounted as an nginx template so ${AUTH_PROXY_SECRET} is substituted at start
# (NGINX_ENVSUBST_FILTER restricts substitution to that one var, leaving $ssl_* etc intact).
#
# Routing:
#   /api/v1/auth/*  -> backend directly, injecting the verified client cert (X-SSL-*) and
#                      the proxy secret. This is the cert-login/bootstrap surface; it must
#                      bypass the Next.js API proxy (which strips X-SSL-* for safety).
#   websocket       -> backend (console/terminal/monitoring).
#   everything else -> frontend (which proxies the rest of the HTTP API same-origin).
# Browser login still flows through NextAuth in the frontend; this direct route serves
# CLI/bootstrap and is gated by the proxy secret + (for bootstrap) the bootstrap token.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $http_upgrade $orcastra_upstream {
    default   http://frontend:2025;
    websocket http://backend:4050;
}

# SECURITY (M3): console/terminal/monitoring WebSockets carry the session JWT as
# ?token=<JWT>. The default access log records $request (with the query string), which
# would leak a replayable bearer token into nginx logs. Redact the query string from
# WebSocket request lines only; normal HTTP request lines are kept intact.
map $http_upgrade $logged_request {
    default   $request;
    websocket "$request_method $uri [ws]";
}

# Forward the auth proxy secret to the backend ONLY on WebSocket upgrades (which route straight
# to the backend). This lets the backend trust the X-SSL-* cert headers on the WS handshake and
# re-bind the session to the presented cert. HTTP requests go to the frontend, where the secret
# is not needed: the empty default makes nginx omit the header so it never leaks to the frontend.
map $http_upgrade $auth_proxy_secret_fwd {
    default   "";
    websocket "${AUTH_PROXY_SECRET}";
}

log_format mini_redacted '$remote_addr - $remote_user [$time_local] '
                         '"$logged_request" $status $body_bytes_sent '
                         '"$http_referer" "$http_user_agent"';

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    access_log /var/log/nginx/access.log mini_redacted;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Trust-on-first-use: request a client cert but do not reject unknown CAs. The app
    # decides trust from the fingerprint. optional_no_ca does not consult a CRL - revocation
    # is enforced in the application layer.
    ssl_verify_client optional_no_ca;
    ssl_verify_depth  2;

    # Disable TLS session resumption so every NEW connection performs a full handshake and
    # re-presents the client's CURRENT cert. Without this, a resumed session could keep carrying
    # a previously-selected cert, delaying enforcement after the user switches certs. Combined
    # with the app-layer per-request cert binding, a switch to a different/unregistered cert is
    # rejected on the next connection (an actively held HTTP/2 connection legitimately keeps its
    # original cert until it turns over - see keepalive_timeout).
    ssl_session_tickets off;
    ssl_session_cache   off;
    keepalive_timeout   15s;

    # Headroom: the verified client cert (escaped PEM, ~2-4KB) is forwarded as a request header
    # on every proxied API call. Avoid header-buffer truncation that would surface as auth errors.
    large_client_header_buffers 8 16k;

    client_max_body_size 0;
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Cert-login / bootstrap: straight to the backend with the verified cert + proxy secret.
    location ^~ /api/v1/auth/ {
        set $auth_upstream http://backend:4050;
        proxy_pass $auth_upstream;
        proxy_http_version 1.1;

        proxy_set_header X-SSL-Client-Verify  $ssl_client_verify;
        proxy_set_header X-SSL-Client-Cert    $ssl_client_escaped_cert;
        proxy_set_header X-SSL-Client-S-DN    $ssl_client_s_dn;
        proxy_set_header X-Auth-Proxy-Secret  "${AUTH_PROXY_SECRET}";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        set $upstream $orcastra_upstream;
        proxy_pass $upstream;
        proxy_http_version 1.1;

        # WebSocket upgrade for console / terminal / monitoring.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # SECURITY: always overwrite from the TLS layer so a browser cannot inject forged
        # client-cert headers. The NextAuth login bridge in the frontend reads these, and the
        # backend re-binds the session to the cert on WebSocket handshakes.
        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        proxy_set_header X-SSL-Client-Cert   $ssl_client_escaped_cert;
        proxy_set_header X-SSL-Client-S-DN   $ssl_client_s_dn;
        # Proxy secret only on WS upgrades (-> backend); empty (omitted) for HTTP (-> frontend).
        proxy_set_header X-Auth-Proxy-Secret $auth_proxy_secret_fwd;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
