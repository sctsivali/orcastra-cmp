[pytest]
# Scoped to backend/: a root pyproject.toml would make the repo root the rootdir and pull the
# frontend tree into collection.
testpaths = tests

# Lets tests import `app` without PYTHONPATH=.
pythonpath = .

# important: without asyncio_mode=auto an `async def test_` is collected but never awaited, so
# it passes without running.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

addopts = -ra
