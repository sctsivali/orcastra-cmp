[pytest]
# Scoped to backend/ deliberately. A root pyproject.toml would make the repo root the
# pytest rootdir and pull the frontend tree into collection.
testpaths = tests

# Replaces the PYTHONPATH=. prefix the tests used to need.
pythonpath = .

# important: without asyncio_mode=auto an `async def test_` is collected but never awaited,
# so an async regression test would silently pass without running. The event-loop tests in
# test_raw_proxy_blocking.py depend on this.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

addopts = -ra
