# Python lint for backend/app.
#
# E9 and F only: syntax errors, undefined names, unresolved imports, locals used before
# assignment. These find real bugs and stay green, so a failure always means something.
# Widen one rule family at a time, with its cleanup in its own commit.

target-version = "py312"
line-length = 120

[lint]
select = ["E9", "F"]

[lint.per-file-ignores]
# Alembic revision files keep the generated imports even when unused.
"alembic/versions/*.py" = ["F401"]
