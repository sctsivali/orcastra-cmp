#cloud-config
ssh_pwauth: false
disable_root: true
package_update: false
package_upgrade: false
write_files:
  - path: /etc/orcastra-qa-hardening
    owner: root:root
    permissions: '0600'
    content: |
      orcastra-qa-hardening
  - path: /etc/orcastra-qa-hardening-run
    owner: root:root
    permissions: '0600'
    content: |
      RUN_ID_WILL_BE_SET_BY_RENDERER
runcmd:
  - [install, -d, -m, '0700', /srv/orcastra-qa-hardening]
  - [install, -d, -m, '0700', /srv/orcastra-qa-hardening/state]
  - [install, -d, -m, '0700', /srv/orcastra-qa-hardening/artifacts]
