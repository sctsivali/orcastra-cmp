name: orcastra-qa-hardening

x-service-defaults: &service-defaults
  restart: "no"
  security_opt:
    - no-new-privileges:true
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "2"
  labels:
    orcastra.qa.lab: orcastra-qa-hardening

services:
  postgres:
    <<: *service-defaults
    image: ${QA_POSTGRES_IMAGE:?An immutable PostgreSQL 17 image is required}
    environment:
      POSTGRES_USER: orcastra_qa
      POSTGRES_DB: orcastra_qa
      POSTGRES_PASSWORD_FILE: /run/secrets/app_database_password
    secrets: [app_database_password]
    volumes: [app-postgres:/var/lib/postgresql/data]
    networks: [application]
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U orcastra_qa -d orcastra_qa"]
      interval: 5s
      timeout: 3s
      retries: 20

  authentik-postgres:
    <<: *service-defaults
    image: ${QA_POSTGRES_IMAGE:?An immutable PostgreSQL 17 image is required}
    environment:
      POSTGRES_USER: authentik_qa
      POSTGRES_DB: authentik_qa
      POSTGRES_PASSWORD_FILE: /run/secrets/auth_database_password
    secrets: [auth_database_password]
    volumes: [auth-postgres:/var/lib/postgresql/data]
    networks: [application]
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U authentik_qa -d authentik_qa"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    <<: *service-defaults
    image: ${QA_REDIS_IMAGE:?An immutable Redis 8 image is required}
    command: [redis-server, --maxmemory, 96mb, --maxmemory-policy, allkeys-lru, --appendonly, "yes"]
    volumes: [redis-data:/data]
    networks: [application]
    mem_limit: 128m
    cpus: 0.25
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20

  vault:
    <<: *service-defaults
    image: ${QA_VAULT_IMAGE:?An immutable Vault image is required}
    command: [server, -config=/vault/config/lab.hcl]
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
      SKIP_SETCAP: "true"
    volumes:
      - vault-data:/vault/file
      - ./vault.hcl:/vault/config/lab.hcl:ro
    networks: [application]
    ports: ["127.0.0.1:32820:8200"]
    mem_limit: 384m
    cpus: 0.25
    healthcheck:
      test: [CMD, vault, status]
      interval: 5s
      timeout: 3s
      retries: 30

  authentik-server:
    <<: *service-defaults
    image: ${QA_AUTHENTIK_IMAGE:?An immutable Authentik image is required}
    command: [server]
    env_file: ["${QA_STATE_DIR:?Private guest state directory is required}/authentik.env"]
    environment:
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgres
      AUTHENTIK_POSTGRESQL__USER: authentik_qa
      AUTHENTIK_POSTGRESQL__NAME: authentik_qa
      AUTHENTIK_LISTEN__HTTP: 0.0.0.0:32090
      AUTHENTIK_LISTEN__HTTPS: ""
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
    volumes: [auth-data:/data]
    networks:
      application:
        aliases: [auth.orcastra-qa.invalid]
    ports: ["127.0.0.1:32090:32090"]
    mem_limit: 1g
    cpus: 0.5
    depends_on:
      authentik-postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, ak, healthcheck]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  authentik-worker:
    <<: *service-defaults
    image: ${QA_AUTHENTIK_IMAGE:?An immutable Authentik image is required}
    command: [worker]
    env_file:
      - "${QA_STATE_DIR:?Private guest state directory is required}/authentik.env"
      - "${QA_STATE_DIR:?Private guest state directory is required}/authentik-bootstrap.env"
    environment:
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgres
      AUTHENTIK_POSTGRESQL__USER: authentik_qa
      AUTHENTIK_POSTGRESQL__NAME: authentik_qa
      AUTHENTIK_LISTEN__HTTP: 0.0.0.0:32090
      AUTHENTIK_LISTEN__HTTPS: ""
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
    volumes: [auth-data:/data]
    networks: [application]
    mem_limit: 1g
    cpus: 0.5
    depends_on:
      authentik-postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, ak, healthcheck]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  backend:
    <<: *service-defaults
    profiles: [application]
    image: ${QA_BACKEND_IMAGE:?A locally built QA source image is required}
    env_file: ["${QA_STATE_DIR:?Private guest state directory is required}/backend.env"]
    environment:
      AUTH_ENABLED: "true"
      DEBUG: "false"
      RUN_MIGRATIONS: "true"
      WEB_CONCURRENCY: "2"
      ORCASTRA_DOMAIN: orcastra-qa.invalid
      CORS_ORIGINS: http://127.0.0.1:32025
      REDIS_ENABLED: "true"
      REDIS_URL: redis://redis:6379/0
      REDIS_ENCRYPTION_ENABLED: "true"
      VAULT_ENABLED: "true"
      VAULT_ADDR: http://vault:8200
      AUTHENTIK_ISSUER: http://auth.orcastra-qa.invalid:32090/application/o/orcastra-qa-hardening/
      AUTHENTIK_AUDIENCE: orcastra-qa-hardening
      AUTHENTIK_API_URL: http://auth.orcastra-qa.invalid:32090/api/v3
      OPENSEARCH_ARCHIVE_ENABLED: "false"
      TASK_JOURNAL_ENABLED: "true"
      TENANT_ACL_ENABLED: "true"
      SNAPSHOT_SCHEDULES_ENABLED: "false"
      MIGRATION_CENTER_ENABLED: "false"
      PROJECT_RELOCATION_ENABLED: "false"
      MIGRATION_DURABLE_COPY_ENABLED: "false"
      MIGRATION_INSTANCE_MOVE_ENABLED: "false"
      MIGRATION_PROJECT_MEMBER_RELOCATION_ENABLED: "false"
      MIGRATION_PROJECT_CROSS_CLUSTER_ENABLED: "false"
    volumes:
      - backend-config:/app/config
      - uploads:/app/uploads
    tmpfs: [/tmp:mode=1777,size=256m]
    networks: [application, lab-targets]
    ports: ["127.0.0.1:32405:4050"]
    mem_limit: 1536m
    cpus: 1.0
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      vault: {condition: service_healthy}
      authentik-server: {condition: service_healthy}

  frontend:
    <<: *service-defaults
    profiles: [application]
    image: ${QA_FRONTEND_IMAGE:?A locally built QA source image is required}
    env_file: ["${QA_STATE_DIR:?Private guest state directory is required}/frontend.env"]
    environment:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:32405
      INTERNAL_BACKEND_URL: http://backend:4050
      NEXTAUTH_URL: http://127.0.0.1:32025
      AUTH_TRUST_HOST: "true"
      AUTHENTIK_ISSUER: http://auth.orcastra-qa.invalid:32090/application/o/orcastra-qa-hardening/
      AUTHENTIK_CLIENT_ID: orcastra-qa-hardening
      NEXT_PUBLIC_AUTHENTIK_LOGOUT_URL: http://auth.orcastra-qa.invalid:32090/application/o/orcastra-qa-hardening/end-session/
      NEXT_TELEMETRY_DISABLED: "1"
    networks: [application]
    ports: ["127.0.0.1:32025:2025"]
    mem_limit: 512m
    cpus: 0.5
    depends_on:
      backend: {condition: service_healthy}

networks:
  application:
    internal: true
    labels: {orcastra.qa.lab: orcastra-qa-hardening}
  # note: this gateway reaches owned nested guest targets only. The outer VM
  # has no NIC or inherited profile, so no route leaves its guest boundary.
  lab-targets:
    labels: {orcastra.qa.lab: orcastra-qa-hardening}

volumes:
  app-postgres:
    labels: {orcastra.qa.lab: orcastra-qa-hardening}
  auth-postgres:
    labels: {orcastra.qa.lab: orcastra-qa-hardening}
  redis-data:
    labels: {orcastra.qa.lab: orcastra-qa-hardening}
  vault-data:
    labels: {orcastra.qa.lab: orcastra-qa-hardening}
  auth-data:
    labels: {orcastra.qa.lab: orcastra-qa-hardening}
  backend-config:
    labels: {orcastra.qa.lab: orcastra-qa-hardening}
  uploads:
    labels: {orcastra.qa.lab: orcastra-qa-hardening}

secrets:
  app_database_password:
    file: ${QA_STATE_DIR:?Private guest state directory is required}/app-database-password
  auth_database_password:
    file: ${QA_STATE_DIR:?Private guest state directory is required}/auth-database-password
