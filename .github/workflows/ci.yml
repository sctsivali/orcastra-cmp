# Continuous integration.
#
# Hermetic suites plus real PostgreSQL/asyncpg, loopback sockets and a browser run against a
# production frontend build. External APIs are fixture-backed; no job receives deployment
# credentials. Checks that need a running deployment (make test-backend-docker, the credentialed
# browser harness) are not part of CI.
#
# Runs on pull requests with one browser project, or by hand with the full four-project matrix.
# `make ci-local` runs every job below locally from this same file and is the gate before a
# direct push.

name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      full_browser_matrix:
        description: Run the browser suite in all four viewport and theme projects
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: orcastra_test
          POSTGRES_PASSWORD: orcastra_test
          POSTGRES_DB: orcastra_journal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orcastra_test -d orcastra_journal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'          # matches backend/Dockerfile
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/constraints.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      # E9 and F only; scope in backend/ruff.toml.
      - name: Lint
        working-directory: backend
        run: ruff check app/

      # Journal contracts run on asyncpg against a database migrated to head. The fixture only
      # truncates its tables when the database name contains "test".
      - name: Migrate journal test database
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://orcastra_test:orcastra_test@127.0.0.1:5432/orcastra_journal_test
        run: alembic upgrade head

      # Tests stay hermetic except the PostgreSQL contract module, which JOURNAL_TEST_DATABASE_URL
      # points at the service above. Webhook delivery contracts need loopback sockets.
      - name: Tests
        working-directory: backend
        env:
          JOURNAL_TEST_DATABASE_URL: postgresql+asyncpg://orcastra_test:orcastra_test@127.0.0.1:5432/orcastra_journal_test
        run: python -m pytest -q

  frontend:
    name: Frontend types, lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'         # matches frontend/Dockerfile
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      # The local binary: `next lint` is deprecated in Next 15 and passes eslintrc options that
      # newer ESLint rejects.
      - name: Lint
        working-directory: frontend
        run: ./node_modules/.bin/eslint src --ext .ts,.tsx

      # Only the build catches a useSearchParams call without a Suspense boundary.
      - name: Build
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build

  guards:
    name: Structural guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies for typed guards
        working-directory: frontend
        run: npm ci
      - name: Mutation coherence registry
        run: node scripts/checks/check-mutation-coherence.mjs .
      - name: Instance inventory freshness
        run: node scripts/checks/check-instance-freshness.mjs .
      - name: Instance create orchestration
        run: node scripts/checks/check-instance-create-orchestration.mjs .
      - name: Image and ISO upload terminal durability
        run: node scripts/checks/check-upload-terminal-durability.mjs .
      - name: Migration authority read errors
        run: node scripts/checks/check-migration-authority-read-errors.mjs .
      - name: Guard parity with make test-frontend
        run: node scripts/checks/check-guard-parity.mjs .
      - name: Instance specification workflow
        run: node scripts/checks/check-instance-specification-workflow.mjs .
      # Mutation forms need a synchronous double-submit guard.
      - name: Submit guards
        run: node scripts/checks/check-submit-guards.mjs .
      - name: Table typography
        run: node scripts/checks/check-table-typography.mjs .
      # Counts, sizes, rates and durations use one face and size within a row.
      - name: Number typography
        run: node scripts/checks/check-number-typography.mjs .
      - name: Unreachable-cluster banners
        run: node scripts/checks/check-unreachable-banner.mjs .
      # Cluster pickers show whether each cluster is answering and use SearchableSelect.
      - name: Node picker status coverage
        run: node scripts/checks/check-node-picker-status.mjs .
      # jitter() in a render body restarts the poll timer on every render.
      - name: Poll jitter resolved once
        run: node scripts/checks/check-poll-jitter.mjs .
      # Sockets authenticate with single-use tickets, never an access token in the URL; each
      # SPICE channel takes its own.
      - name: WebSocket tickets
        run: node scripts/checks/check-ws-tickets.mjs .
      # Unbounded API lists use SearchableSelect instead of a plain Select.
      - name: Long-list selects
        run: node scripts/checks/check-long-list-selects.mjs .
      - name: Banner role gates
        run: node scripts/checks/check-banner-role-gate.mjs .
      # A route hidden from a role in the nav must also refuse that role itself.
      - name: Role gates
        run: node scripts/checks/check-role-gates.mjs .
      # Logout or a role change clears every role-scoped query and live transport before the
      # next identity renders, so operator data cannot leak into a Tenant view.
      - name: Auth transition isolation
        run: node scripts/checks/check-auth-transition-isolation.mjs .
      # Tenant UI uses the minimal availability projections; a node inventory read would
      # disclose host capacity.
      - name: Tenant node-inventory isolation
        run: node scripts/checks/check-tenant-node-inventory.mjs .
      # Wire values stay lowercase; the display layer owns their labels. Raw status fields may
      # not be rendered in JSX.
      - name: Controlled status labels
        run: node scripts/checks/check-status-display.mjs .
      - name: Technologies role split
        run: node scripts/checks/check-technologies-role-split.mjs .
      - name: Instance live Metrics contract
        run: node scripts/checks/check-instance-live-metrics.mjs .
      # A document reload in the console beacons kill-all-sessions and closes every console and
      # terminal the operator has open.
      - name: Console reloads
        run: node scripts/checks/check-no-console-reload.mjs .
      - name: Console session project scope
        run: node scripts/checks/check-console-session-project-scope.mjs .
      # useSearchParams needs a Suspense boundary above it or `next build` fails on that route.
      # Catches it before the slower Build step.
      - name: SearchParams Suspense boundaries
        run: node scripts/checks/check-searchparams-suspense.mjs .
      # Every sortable column declares a facet, filter, search accessor or written waiver; node
      # and project columns declare their dimension; at most two non-dimension primary facets.
      - name: Table filter coverage
        run: node scripts/checks/check-table-filters.mjs .
      # Every filter kind survives a URL round trip, including a text query equal to the empty
      # sentinel.
      - name: Filter URL round trip
        run: node scripts/checks/check-filter-url-roundtrip.mjs .
      # The user menu's Profile link is derived from the IdP end-session URL; a wrong
      # derivation silently sends users to another IdP.
      - name: IdP account settings link
        run: node scripts/checks/check-idp-urls.mjs .
      # Same-path URL writes from interactions use history writes: on Next 15.5 a params-only
      # router.replace can scroll the page to the top under an open popover.
      - name: URL writes
        run: node scripts/checks/check-url-writes.mjs .
      # Links into filtered lists come from one registry whose keys are checked against the
      # target table's definition.
      - name: Inventory links
        run: node scripts/checks/check-inventory-links.mjs .
      # Node and Cluster cells render NodeLink, which owns the Partner gate.
      - name: Node and Cluster cells
        run: node scripts/checks/check-node-link.mjs .
      # Icon-only buttons need an accessible name; a Radix Tooltip only adds a description.
      - name: Icon button names
        run: node scripts/checks/check-icon-button-names.mjs .
      # Card illustrations are decoration in one palette: colour only in their stylesheet, flat,
      # one aria-hidden svg root, hideable from the first byte, and never used as an icon.
      # check-semantic-colour.mjs does not read SVG fill or stroke attributes.
      - name: Card illustrations
        run: node scripts/checks/check-illustrations.mjs .
      # An attribute placed after its opening `>` is a text child that JSX renders verbatim.
      # tsc and eslint accept it.
      - name: Stray JSX attributes
        run: node scripts/checks/check-jsx-stray-attrs.mjs .
      # Truncated text must be revealable and must not feed a truncated value into an
      # accessible name. Runs after the stray-attribute check, because two of its rules read
      # aria-label and title from opening tags.
      - name: Truncation reveal
        run: node scripts/checks/check-truncation-reveal.mjs .

      # Titles are Title Case; empty and error states are sentence case whatever element
      # renders them.
      - name: Heading case
        run: node scripts/checks/check-heading-case.mjs .

      # Dialogs open from focusable controls (a Badge is a div), and a height-bounded
      # DialogContent scrolls in DialogBody so the title stays visible.
      - name: Dialog affordances
        run: node scripts/checks/check-dialog-affordances.mjs .
      # Bans translucent same-hue tints behind saturated text and computes the WCAG contrast
      # ratio of every cva variant in both themes against the 4.5:1 floor.
      - name: Semantic colour and contrast
        run: node scripts/checks/check-semantic-colour.mjs .

      # The default sidebar and accent colours are defined in several places. Keeps the copies
      # equal, checks each hex against its HSL triplet, and measures the shipped pair.
      - name: Personalization defaults
        run: node scripts/checks/check-personalization-defaults.mjs .

      # The branding editor must target the same organization the sidebar shows.
      - name: Organization branding target
        run: node scripts/checks/check-org-branding-target.mjs .

      - name: Terminal theme
        run: node scripts/checks/check-terminal-theme.mjs .
      - name: Text from outside the PTY reaches xterm sanitized
        run: node scripts/checks/check-terminal-output.mjs .

      - name: One date format, in every zone an operator sits in
        run: node scripts/checks/check-date-format.mjs .

      - name: One spelling for ellipsis, plurals, placeholders and toast titles
        run: node scripts/checks/check-copy-standard.mjs .

      - name: Page headers stack on a phone
        run: node scripts/checks/check-page-header-stacks.mjs .

      # Flags em dashes used as punctuation in copy. Advisory (exits 0): the placeholder glyph
      # in table-text.tsx is a legitimate use of the same character.
      - name: Prose typography
        run: node scripts/checks/check-prose-typography.mjs .

      - name: Byte units
        run: node scripts/checks/check-byte-units.mjs .

      - name: Settings behavior
        run: node scripts/checks/check-settings-hardening.mjs .

      - name: Sign-in return path
        run: node scripts/checks/check-auth-callback.mjs .

      - name: Token rotation
        run: node scripts/checks/check-token-rotation.mjs .

      - name: Session cookie echo
        run: node scripts/checks/check-session-cookie-echo.mjs .

      # invalid_grant ends the session and sends a deep link through sign-in; a timeout, 5xx or
      # 429 cools down instead.
      - name: Auth refresh contract
        run: node scripts/checks/check-auth-refresh-contract.mjs .

      # Terminal and console refuse after accept, with a close code and reason token the page
      # acts on (a close before accept reaches the browser as a bare 1006). Keeps the backend
      # and frontend tables equal and runs the page's recovery decisions.
      - name: Terminal and console close contract
        run: node scripts/checks/check-ws-close-contract.mjs .

      - name: Access gate
        run: node scripts/checks/check-access-gate.mjs .

      - name: Vault notice
        run: node scripts/checks/check-vault-notice.mjs .

      - name: Tenant term notice
        run: node scripts/checks/check-tenant-term-notice.mjs .

      - name: Branding surfaces
        run: node scripts/checks/check-branding-surfaces.mjs .

      - name: Release notice
        run: node scripts/checks/check-release-notice.mjs .

      - name: Console guest actions
        run: node scripts/checks/check-console-actions.mjs .

      - name: SPICE client
        run: node scripts/checks/check-spice-client.mjs .

      - name: Guest credentials secrets
        run: node scripts/checks/check-guest-credentials-secrets.mjs .

      - name: Task journal behavior
        run: node scripts/checks/check-task-journal-behavior.mjs .

      - name: Operator UI terminology
        run: node scripts/checks/check-ui-glossary.mjs .

      - name: Documentation index
        run: node scripts/checks/check-doc-index.mjs .

      - name: Comment hygiene
        run: node scripts/checks/check-comment-hygiene.mjs .

      # Table owns its scroll container; a second scrolling wrapper splits the axes and buries
      # the horizontal scrollbar. Clipping wrappers are allowed.
      - name: Table scroll containers
        run: node scripts/checks/check-table-scroll.mjs .

  commit-format:
    name: Conventional commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      # Same rules as .githooks/commit-msg. config-conventional ignores merge commits.
      - name: Lint commit messages
        working-directory: frontend
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

  # One job per Playwright project (viewport and theme), run in parallel; each takes about 6-8
  # minutes plus the build. Pull requests run desktop-light only; a manual run with
  # full_browser_matrix, and `make ci-local`, run all four. `inputs` is empty outside
  # workflow_dispatch.
  browser-e2e:
    name: Browser role and behavior QA (${{ matrix.project }})
    runs-on: ubuntu-latest
    needs: frontend
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(inputs.full_browser_matrix && '["desktop-light","mobile-dark","desktop-dark","mobile-light"]' || '["desktop-light"]') }}
    permissions:
      contents: read
    env:
      CI: 'true'
      ORCASTRA_E2E_BASE_URL: http://127.0.0.1:2025
      AUTH_SECRET: orcastra-e2e-only-secret-32-characters-minimum
      NEXTAUTH_SECRET: orcastra-e2e-only-secret-32-characters-minimum
      NEXTAUTH_URL: http://127.0.0.1:2025
      AUTHENTIK_ISSUER: https://idp.invalid/application/o/orcastra/
      AUTHENTIK_CLIENT_ID: orcastra-e2e-client
      AUTHENTIK_CLIENT_SECRET: unused-e2e-client-secret
      NEXT_PUBLIC_API_URL: ''
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install application dependencies
        working-directory: frontend
        run: npm ci

      - name: Build production frontend
        working-directory: frontend
        run: npm run build

      # The pinned runner stays out of the production dependency graph; no manifest is
      # rewritten.
      - name: Install pinned browser test runner
        working-directory: frontend
        run: npm install --prefix "$RUNNER_TEMP/orcastra-playwright" --no-save --no-package-lock @playwright/test@1.51.1

      - name: Install Chromium
        working-directory: frontend
        run: '"$RUNNER_TEMP/orcastra-playwright/node_modules/.bin/playwright" install --with-deps chromium'

      # The suite mints local Auth.js sessions and fails on any unexpected API call; no live
      # service or credential is involved.
      - name: Run role-scoped browser scenarios
        working-directory: frontend
        env:
          ORCASTRA_E2E_OUTPUT_DIR: ${{ runner.temp }}/orcastra-e2e/test-results
          ORCASTRA_E2E_REPORT_DIR: ${{ runner.temp }}/orcastra-e2e/playwright-report
        run: NODE_PATH="$RUNNER_TEMP/orcastra-playwright/node_modules" "$RUNNER_TEMP/orcastra-playwright/node_modules/.bin/playwright" test --config=playwright.config.cjs --project=${{ matrix.project }}

      - name: Upload browser QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-artifacts-${{ matrix.project }}
          path: |
            ${{ runner.temp }}/orcastra-e2e/playwright-report
            ${{ runner.temp }}/orcastra-e2e/test-results
          if-no-files-found: ignore
          retention-days: 7
