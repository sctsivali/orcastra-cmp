# Continuous integration.
#
# Hosted runners cover the hermetic suites plus the boundaries the local sandbox cannot exercise:
# real PostgreSQL/asyncpg, loopback sockets, and a browser driven against a production frontend
# build. Every external API is fixture-backed; these jobs never receive deployment credentials.
#
# What is deliberately NOT here, because it needs the dev VM and cannot work on a hosted runner:
# make test-backend-docker (inspects a running container) and the credentialed Playwright harness
# in /root/qa-orcastra, which drives real Authentik SSO against a private address.

name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: orcastra_test
          POSTGRES_PASSWORD: orcastra_test
          POSTGRES_DB: orcastra_journal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orcastra_test -d orcastra_journal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'          # matches backend/Dockerfile
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      # E9 and F only: syntax errors, undefined names, unresolved imports, locals used before
      # assignment. See backend/ruff.toml for why pylint is not used.
      - name: Lint
        working-directory: backend
        run: ruff check app/

      # Journal contracts intentionally use asyncpg against a database migrated to the exact
      # application head. The database name contains "test", which is required by the fixture's
      # destructive-operation guard before it can truncate its three journal-only tables.
      - name: Migrate journal test database
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://orcastra_test:orcastra_test@127.0.0.1:5432/orcastra_journal_test
        run: alembic upgrade head

      # Most tests stay hermetic. JOURNAL_TEST_DATABASE_URL opts only the explicit PostgreSQL
      # contract module into the disposable service. The hosted runner also supplies the loopback
      # socket capability needed by the delivery-signature and retry-amplification contracts.
      - name: Tests
        working-directory: backend
        env:
          JOURNAL_TEST_DATABASE_URL: postgresql+asyncpg://orcastra_test:orcastra_test@127.0.0.1:5432/orcastra_journal_test
        run: python -m pytest -q

  frontend:
    name: Frontend types, lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'              # matches frontend/Dockerfile
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      # The local binary, not `next lint`: that is deprecated in Next 15 and passes eslintrc-era
      # options a newer ESLint rejects, so it fails for reasons unrelated to the code.
      - name: Lint
        working-directory: frontend
        run: ./node_modules/.bin/eslint src --ext .ts,.tsx

      # Load-bearing rather than ceremonial: two routes are split behind Suspense precisely
      # because useSearchParams breaks prerendering without it, and only the build catches that.
      - name: Build
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build

  guards:
    name: Structural guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Pure filesystem AST walk over frontend/src, no install needed. Catches a mutation form
      # shipping without a synchronous double-submit guard.
      - name: Submit guards
        run: node scripts/checks/check-submit-guards.mjs .
      # Same shape: no install, no browser. Both were only run by make test-frontend, so a pull
      # request could land a table off the shared type scale, or a page dropping the
      # unreachable-cluster banner, without either guard ever firing.
      - name: Table typography
        run: node scripts/checks/check-table-typography.mjs .
      - name: Unreachable-cluster banners
        run: node scripts/checks/check-unreachable-banner.mjs .
      # A control that asks an operator to choose a cluster must say whether that cluster is
      # answering, and hand the hook's options to SearchableSelect rather than a plain Select.
      # The vocabulary existed; four pickers were simply never wired to it, and two of them hid
      # the unreachable clusters instead of marking them.
      - name: Node picker status coverage
        run: node scripts/checks/check-node-picker-status.mjs .
      # A list an API returns with no upper bound is a SearchableSelect, never a plain Select;
      # the project picker on the create form outgrew its popover on one fleet.
      - name: Long-list selects
        run: node scripts/checks/check-long-list-selects.mjs .
      # The nav hides a route by role; the route itself must also refuse it. Two of the seven
      # partner destinations shipped with no page-level gate at all.
      - name: Role gates
        run: node scripts/checks/check-role-gates.mjs .
      # A document reload anywhere in the console surface beacons kill-all-sessions, so it
      # takes out every other console and terminal the operator has open, not just the panel
      # that failed. Two of these shipped and were removed.
      - name: Console reloads
        run: node scripts/checks/check-no-console-reload.mjs .
      # useSearchParams opts a component out of prerendering, so Next needs a Suspense
      # boundary above it or `next build` fails on that route. Typecheck does not see it, so
      # this used to surface only at the Build step minutes later.
      - name: SearchParams Suspense boundaries
        run: node scripts/checks/check-searchparams-suspense.mjs .
      # A column an operator can see is a column an operator can filter by. Every column with
      # a sort accessor must declare a facet, a filter, a search accessor or a written waiver;
      # a node or project column must declare which dimension it is; and no table may mark
      # more than two non-dimension facets primary.
      - name: Table filter coverage
        run: node scripts/checks/check-table-filters.mjs .
      # A filter that serialises into a shared link and parses back as something else is the
      # worst failure this system can have: the URL looks right and the table is wrong. This
      # compiles the codec standalone and round-trips every kind, including a text query that
      # is literally the empty sentinel.
      - name: Filter URL round trip
        run: node scripts/checks/check-filter-url-roundtrip.mjs .
      # A same-path URL write from an interaction (a facet, a tab, a picker) must be a history
      # write, not a navigation: on Next 15.5 a params-only router.replace can take the
      # aliased-prefetch path and scroll the page to the top under the open popover.
      - name: URL writes
        run: node scripts/checks/check-url-writes.mjs .
      # A link into a filtered list is built by one registry, whose keys are proven against
      # the target page's table definition. A hand-written href spelled the key for the wrong
      # table or carried the display name where the facet compares the id, and landed on
      # "No X matches the current filters" above a list that had the rows.
      - name: Inventory links
        run: node scripts/checks/check-inventory-links.mjs .
      # A Node or Cluster cell renders one component that owns the Partner gate. Three tables
      # linked the node into Clusters (two of them for a Tenant, who landed on the welcome
      # page) while twenty others printed the same id as dead text.
      - name: Node and Cluster cells
        run: node scripts/checks/check-node-link.mjs .
      # A button holding nothing but an icon is announced as a bare "button" unless the
      # element names itself. A Radix Tooltip does not do it: it contributes
      # aria-describedby, which is a description. Measured live before this check existed,
      # the dashboard had 22 such buttons on one screen and the shared pagination 4 more.
      - name: Icon button names
        run: node scripts/checks/check-icon-button-names.mjs .
      # An attribute that lands below its own opening `>` is a text child, and JSX renders it
      # verbatim. Every project card on /inventory drew "aria-label=Project actions for <name>"
      # across its title for three days, from the very commit meant to name that button. tsc,
      # eslint and the icon-button guard all accept the shape.
      - name: Stray JSX attributes
        run: node scripts/checks/check-jsx-stray-attrs.mjs .
      # truncateFingerprint cut every 64 character image fingerprint to 12 and appended "...",
      # and one of its four call sites fed the result into an accessible NAME, so the aliases
      # cell announced "Show all 3 aliases on 1a4eed830630...". Seventeen more sites hand-rolled
      # the same slice-plus-dots, six cut an id and appended nothing at all, and 74 elements
      # clipped in CSS with no title, no aria-label and no reveal control above them.
      #
      # Ordered after the stray-attribute check on purpose: two of its rules read aria-label and
      # title out of opening tags, and an attribute that has fallen into child position would
      # make them credit an element with a name it does not carry.
      - name: Truncation reveal
        run: node scripts/checks/check-truncation-reveal.mjs .

      # /technologies rendered "Fleet totals" above a card titled "CPU Resources" whose rows
      # read "Total Cores" and "Memory per Node", then "Hardware by node" above rows reading
      # "CPU topology", "Base clock" and "Physical cores". "Logical CPUs" sat one line above
      # "Physical cores" in the same grid. Across the app 71 strings broke the contract in one
      # direction or the other, and clustering/members/page.tsx shipped "No Members Found" and
      # "No members found" six lines apart.
      #
      # Checked both ways: titles must be Title Case, and empty or error states must be
      # sentences whatever element renders them.
      - name: Heading case
        run: node scripts/checks/check-heading-case.mjs .

      # A Badge renders a div, so a dialog opened from one is mouse-only: no focus, no focus
      # ring, and Enter does nothing. And a DialogContent that bounds its own height must clip
      # and scroll in DialogBody, or the title scrolls away with the body on a long record.
      - name: Dialog affordances
        run: node scripts/checks/check-dialog-affordances.mjs .
      # A translucent tint behind saturated same-hue text is the app's most recognisable
      # generated-UI signature. It was banned in prose and enforced by nothing, so it reached
      # four of the nine Badge variants. It is also a WCAG failure: the amber one measures
      # 2.73:1 on 12px semibold against a 4.5:1 floor. This also computes the ratio for every
      # cva variant in both themes, which is what catches a "fix" that only darkens the text:
      # doing that leaves warning at 4.30 and still failing.
      - name: Semantic colour and contrast
        run: node scripts/checks/check-semantic-colour.mjs .

      # The default sidebar and accent are written down in five places, and they came apart:
      # the CSS accent hex said #8b5cf6 while its own HSL triplet said #7c3bed, so the app
      # painted one purple before hydration and another after, and the contrast guard above
      # scored the colour the browser stops using. This holds the copies equal, converts each
      # hex to check its own triplet, and measures the shipped pair.
      - name: Personalization defaults
        run: node scripts/checks/check-personalization-defaults.mjs .

      # The branding editor auto-selected the alphabetically first organization while the sidebar
      # read the caller's earliest membership, so an operator edited a customer's branding while
      # watching their own and every change looked like it reverted. No QA account has the shape
      # that reproduces it, so the browser spec would go green through the same regression.
      - name: Organization branding target
        run: node scripts/checks/check-org-branding-target.mjs .

      # An em dash joined the two halves of the stop dialog's warning, and the same character
      # was in 83 other places across the console, the API layer and the README. tsc and
      # eslint do not read English, so nothing saw it. Advisory for now: it reports and exits
      # 0, because the placeholder glyph in table-text.tsx is a legitimate use of the same
      # character and the rule that separates them is worth watching before it becomes a gate.
      - name: Prose typography
        run: node scripts/checks/check-prose-typography.mjs .

      # The image picker's row list scrolled vertically in one box and horizontally in another,
      # so its horizontal scrollbar was painted below the last row and only appeared once the
      # list was scrolled all the way down. Every column to the right was unreachable at any
      # other position. Table already owns a scroll container, so a second scrolling wrapper is
      # what splits the axes. Clipping wrappers are deliberately still allowed: they cannot bury
      # a scrollbar.
      - name: Table scroll containers
        run: node scripts/checks/check-table-scroll.mjs .

  commit-format:
    name: Conventional commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      # Mirrors .githooks/commit-msg so CI enforces what the local hook does. Merge commits are
      # ignored by @commitlint/config-conventional's own defaults.
      - name: Lint commit messages
        working-directory: frontend
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}
