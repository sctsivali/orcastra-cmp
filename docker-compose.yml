services:
  # PostgreSQL Database
  postgres:
    image: postgres:17-alpine
    container_name: ${CONTAINER_PREFIX:-orcastra-dashboard}-postgres
    restart: always
    # important: bound to loopback by default. The backend uses the compose network, and a bare
    # port would expose the database login on every interface. POSTGRES_PORT accepts
    # "[address:]port" to expose it on purpose (POSTGRES_PORT=0.0.0.0:5432).
    ports:
      - "${POSTGRES_PORT:-127.0.0.1:5432}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - orcastra-dashboard
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Redis Cache
  redis:
    image: redis:8-alpine
    container_name: ${CONTAINER_PREFIX:-dev-orcastra-dashboard}-redis
    restart: always
    # important: loopback only. Redis has no password, and on a public interface anyone could
    # read and write sessions, tickets and cached authorization state.
    # REDIS_PORT is [host_ip:]port, as in docker-compose.prod.yml and the installers.
    ports:
      - "${REDIS_PORT:-127.0.0.1:6381}:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - orcastra-dashboard
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    volumes:
      - redis-data:/data

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        - APP_VERSION=${APP_VERSION:-latest}
        # The version string is for humans; the commit identifies the code.
        - BUILD_COMMIT=${BUILD_COMMIT:-}
        - BUILD_DATE=${BUILD_DATE:-}
    image: ${CONTAINER_PREFIX:-dev-orcastra-dashboard}-backend:${APP_VERSION:-latest}
    container_name: ${CONTAINER_PREFIX:-dev-orcastra-dashboard}-backend
    restart: always
    ports:
      - "${BACKEND_PORT:-4050}:4050"
    env_file:
      - .env
    environment:
      - APP_VERSION=${APP_VERSION:-latest}
      - API_VERSION=${API_VERSION:-latest}
      # DEBUG intentionally comes only from env_file: host tooling often exports a non-boolean
      # DEBUG that Compose interpolation would pick up. Keep migrations on; set RUN_MIGRATIONS=false only
      # for an application-only rollback across an additive schema.
      - RUN_MIGRATIONS=${RUN_MIGRATIONS:-true}
      - DATABASE_URL=${DATABASE_URL}

      # JWT validation
      - AUTH_ENABLED=${AUTH_ENABLED:-true}
      - AUTHENTIK_ISSUER=${AUTHENTIK_ISSUER}
      - AUTHENTIK_AUDIENCE=${AUTHENTIK_CLIENT_ID}

      # Authentik Admin API (push role groups)
      - AUTHENTIK_API_URL=${AUTHENTIK_API_URL:-}
      - AUTHENTIK_API_TOKEN=${AUTHENTIK_API_TOKEN:-}

      # Domain for PKI certificates
      - ORCASTRA_DOMAIN=${ORCASTRA_DOMAIN:-orcastra.io}

      # OpenSearch Archive (optional - for log archive management API)
      - OPENSEARCH_ARCHIVE_ENABLED=${OPENSEARCH_ARCHIVE_ENABLED:-false}

      # Recurring snapshot schedules. Off by default so a deploy never starts taking snapshots
      # on live clusters by itself. The flag gates the routes as well as the loop. Runtime only.
      - SNAPSHOT_SCHEDULES_ENABLED=${SNAPSHOT_SCHEDULES_ENABLED:-false}
      - SNAPSHOT_SCHEDULE_TICK_SECONDS=${SNAPSHOT_SCHEDULE_TICK_SECONDS:-30}
      - SNAPSHOT_SCHEDULE_BATCH=${SNAPSHOT_SCHEDULE_BATCH:-8}
      # Instance copy, move and project relocation are on by default; each flag is a kill
      # switch, and PROJECT_RELOCATION_ENABLED gates every project stage. Daemon builds must meet
      # the patched-version policy or be listed in MIGRATION_BUILD_ALLOW.
      - MIGRATION_CENTER_ENABLED=${MIGRATION_CENTER_ENABLED:-true}
      - PROJECT_RELOCATION_ENABLED=${PROJECT_RELOCATION_ENABLED:-true}
      - MIGRATION_DURABLE_COPY_ENABLED=${MIGRATION_DURABLE_COPY_ENABLED:-true}
      - MIGRATION_INSTANCE_MOVE_ENABLED=${MIGRATION_INSTANCE_MOVE_ENABLED:-true}
      - MIGRATION_PROJECT_MEMBER_RELOCATION_ENABLED=${MIGRATION_PROJECT_MEMBER_RELOCATION_ENABLED:-true}
      - MIGRATION_PROJECT_CROSS_CLUSTER_ENABLED=${MIGRATION_PROJECT_CROSS_CLUSTER_ENABLED:-true}
      - MIGRATION_PLAN_TTL_SECONDS=${MIGRATION_PLAN_TTL_SECONDS:-900}
      - MIGRATION_DEFAULT_RETENTION_HOURS=${MIGRATION_DEFAULT_RETENTION_HOURS:-24}
      - MIGRATION_MAX_RETENTION_HOURS=${MIGRATION_MAX_RETENTION_HOURS:-168}
      - MIGRATION_RECOVERY_TICK_SECONDS=${MIGRATION_RECOVERY_TICK_SECONDS:-15}
      - MIGRATION_GLOBAL_CONCURRENCY=${MIGRATION_GLOBAL_CONCURRENCY:-2}
      - MIGRATION_APPROVED_BUILDS=${MIGRATION_APPROVED_BUILDS:-}
      - MIGRATION_BUILD_ALLOW=${MIGRATION_BUILD_ALLOW:-}
      # Extra https image servers an API key may name, beyond the public catalogues and the
      # registered clusters, ex; an integrator's own simplestreams mirror.
      - KEY_IMAGE_SERVERS_ALLOW=${KEY_IMAGE_SERVERS_ALLOW:-}
      - MIGRATION_BUILD_DENY=${MIGRATION_BUILD_DENY:-}
      - MIGRATION_RECOVERY_ACTIONS_ENABLED=${MIGRATION_RECOVERY_ACTIONS_ENABLED:-true}
      - MIGRATION_AUTO_CLEANUP_ENABLED=${MIGRATION_AUTO_CLEANUP_ENABLED:-true}
      - MIGRATION_RUNNING_SOURCE_ENABLED=${MIGRATION_RUNNING_SOURCE_ENABLED:-true}
      - MIGRATION_DEFAULT_STOP_TIMEOUT_SECONDS=${MIGRATION_DEFAULT_STOP_TIMEOUT_SECONDS:-120}
      - MIGRATION_PROJECT_MAX_INSTANCES=${MIGRATION_PROJECT_MAX_INSTANCES:-25}
      - MIGRATION_ORCAHUB_IDENTITY_CHANGE_ENABLED=${MIGRATION_ORCAHUB_IDENTITY_CHANGE_ENABLED:-false}
      - MIGRATION_LXD_NATIVE_CROSS_PROJECT_MOVE_APPROVED_BUILDS=${MIGRATION_LXD_NATIVE_CROSS_PROJECT_MOVE_APPROVED_BUILDS:-}
      - TASK_JOURNAL_ENABLED=${TASK_JOURNAL_ENABLED:-true}
      - TASK_JOURNAL_RETENTION_DAYS=${TASK_JOURNAL_RETENTION_DAYS:-30}
      - CLUSTER_LOG_RETENTION_DAYS=${CLUSTER_LOG_RETENTION_DAYS:-30}
      - TASK_JOURNAL_EXCLUDE_CLUSTERS=${TASK_JOURNAL_EXCLUDE_CLUSTERS:-}
      - TASK_JOURNAL_CACHE_CLEARANCE=${TASK_JOURNAL_CACHE_CLEARANCE:-true}
      - OPENSEARCH_URL=${OPENSEARCH_URL:-}
      - OPENSEARCH_ADMIN_USER=${OPENSEARCH_ADMIN_USER:-admin}
      - OPENSEARCH_ADMIN_PASSWORD=${OPENSEARCH_ADMIN_PASSWORD:-}
      - OPENSEARCH_SSL_VERIFY=${OPENSEARCH_SSL_VERIFY:-false}
      - OPENSEARCH_SNAPSHOT_REPO=${OPENSEARCH_SNAPSHOT_REPO:-orcastra-archive}

    volumes:
      - ./config:/app/config:rw
      - /var/orcastra/uploads:/app/uploads:rw
    networks:
      - orcastra-dashboard
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    # Resource limits, also what Dashboard Host reports for the container. Four workers use
    # roughly 2 GB under load, and an OOM-killed worker is silent (RestartCount stays 0, the
    # healthcheck passes) apart from dropped requests and cut console sessions. Per-worker
    # memory grows with the number of registered clusters, so raise this as clusters are added.
    mem_limit: ${BACKEND_MEM_LIMIT:-4g}
    cpus: ${BACKEND_CPUS:-2}
    healthcheck:
      # Same probe as docker-compose.prod.yml and the Dockerfile HEALTHCHECK. Its own 3s
      # timeout keeps a hung probe distinguishable from a hung app.
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:4050/health', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s

    # Security hardening
    security_opt:
      - no-new-privileges:true
    read_only: false
    tmpfs:
      - /tmp:mode=1777,size=${BACKEND_TMPFS_SIZE:-256m}

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - NEXT_PUBLIC_AUTHENTIK_LOGOUT_URL=${NEXT_PUBLIC_AUTHENTIK_LOGOUT_URL}
        - APP_VERSION=${APP_VERSION:-latest}
        # Same as the backend: the commit identifies the code.
        - BUILD_COMMIT=${BUILD_COMMIT:-}
        - BUILD_DATE=${BUILD_DATE:-}
        - AUTHENTIK_ISSUER=${AUTHENTIK_ISSUER}
        - AUTHENTIK_CLIENT_ID=${AUTHENTIK_CLIENT_ID}
        # important: AUTHENTIK_CLIENT_SECRET and NEXTAUTH_SECRET are injected at runtime
        # through the environment block. Never bake secrets into image layers.
    image: ${CONTAINER_PREFIX:-dev-orcastra-dashboard}-frontend:${APP_VERSION:-latest}
    container_name: ${CONTAINER_PREFIX:-dev-orcastra-dashboard}-frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-2025}:2025"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_AUTHENTIK_LOGOUT_URL=${NEXT_PUBLIC_AUTHENTIK_LOGOUT_URL}
      # Sidebar support links. Unset, the Orcastra project's issue tracker and forum are used.
      # Runtime only, no rebuild.
      - NEXT_PUBLIC_BUG_REPORT_URL=${NEXT_PUBLIC_BUG_REPORT_URL:-}
      - NEXT_PUBLIC_COMMUNITY_URL=${NEXT_PUBLIC_COMMUNITY_URL:-}
      # important: opt-in. The frontend re-emits these headers as the client IP the backend
      # trusts, and this port is reachable directly, so enabling it without a real reverse
      # proxy lets a caller pick the address it is rate-limited and audited by.
      - FORWARD_CLIENT_IP_HEADERS=${FORWARD_CLIENT_IP_HEADERS:-false}
      - TRUSTED_CLIENT_IP_HEADERS=${TRUSTED_CLIENT_IP_HEADERS:-cf-connecting-ip,true-client-ip,cf-connecting-ipv6,x-forwarded-for,x-real-ip}
      # Internal Docker URL for server-side API proxying
      - INTERNAL_BACKEND_URL=http://backend:4050
      # Regions map basemap. Unset, the bundled outline map is drawn (no outbound request,
      # works air-gapped). MAP_TILE_URL takes an XYZ tile template. Runtime only, no rebuild.
      - MAP_TILE_URL=${MAP_TILE_URL:-}
      - MAP_TILE_URL_DARK=${MAP_TILE_URL_DARK:-}
      - MAP_TILE_ATTRIBUTION=${MAP_TILE_ATTRIBUTION:-}
      - MAP_TILE_ATTRIBUTION_URL=${MAP_TILE_ATTRIBUTION_URL:-}
      - MAP_TILE_SUBDOMAINS=${MAP_TILE_SUBDOMAINS:-}
      - MAP_TILE_MAX_ZOOM=${MAP_TILE_MAX_ZOOM:-}

      # Auth.js runtime
      - AUTHENTIK_ISSUER=${AUTHENTIK_ISSUER}
      - AUTHENTIK_CLIENT_ID=${AUTHENTIK_CLIENT_ID}
      - AUTHENTIK_CLIENT_SECRET=${AUTHENTIK_CLIENT_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - AUTH_TRUST_HOST=true

    networks:
      - orcastra-dashboard
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:2025"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Fluent Bit sidecar: collects container logs and ships them to OpenSearch
  fluent-bit:
    image: fluent/fluent-bit:4.2.2-debug
    container_name: ${CONTAINER_PREFIX:-orcastra-dashboard}-fluent-bit
    restart: always
    volumes:
      - ./config/fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./config/fluent-bit/parsers.conf:/fluent-bit/etc/parsers.conf:ro
      - ./config/fluent-bit/parse_json.lua:/fluent-bit/etc/parse_json.lua:ro
      - fluent-bit-data:/fluent-bit/data
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/log/containers:/var/log/containers:ro
    environment:
      # OpenSearch connection
      - OPENSEARCH_HOST=${OPENSEARCH_HOST:?OPENSEARCH_HOST is required}
      - OPENSEARCH_PORT=${OPENSEARCH_PORT:-9200}
      - OPENSEARCH_USER=${OPENSEARCH_USER:-fluentbit}
      - OPENSEARCH_PASSWORD=${OPENSEARCH_PASSWORD:?OPENSEARCH_PASSWORD is required}
      # Disk buffer per log stream while OpenSearch is unavailable (storage.total_limit_size in
      # config/fluent-bit/fluent-bit.conf). The defaults need 14G free on the host.
      - FLUENT_BIT_ACCESS_BUFFER_LIMIT=${FLUENT_BIT_ACCESS_BUFFER_LIMIT:-2G}
      - FLUENT_BIT_AUDIT_BUFFER_LIMIT=${FLUENT_BIT_AUDIT_BUFFER_LIMIT:-8G}
      - FLUENT_BIT_APP_BUFFER_LIMIT=${FLUENT_BIT_APP_BUFFER_LIMIT:-4G}
    networks:
      - orcastra-dashboard
    depends_on:
      - backend
      - frontend
    healthcheck:
      # The -debug image includes curl for the HTTP health check
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:2020/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    # Optional: forward through the Docker log driver instead of the volume mount
    # logging:
    #   driver: fluentd
    #   options:
    #     fluentd-address: localhost:24224
    #     tag: orcastra.fluent-bit

networks:
  orcastra-dashboard:
    driver: bridge

volumes:
  redis-data:
  postgres-data:
  fluent-bit-data:
