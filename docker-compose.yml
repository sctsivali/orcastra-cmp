

services:
  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: dev-orcastra-dashboard-backend
    container_name: dev-orcastra-dashboard-backend
    restart: always
    ports:
      - "4050:4050"
    env_file:
      - .env
    environment:
      - DEBUG=${DEBUG:-false}
    volumes:
      - ./certs:/certs:ro
      - ./config:/app/config
    networks:
      - orcastra-dashboard
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4050/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:4050
    image: dev-orcastra-dashboard-frontend
    container_name: dev-orcastra-dashboard-frontend
    restart: always
    ports:
      - "2025:2025"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4050
    networks:
      - orcastra-dashboard
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:2025"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  orcastra-dashboard:
    driver: bridge
