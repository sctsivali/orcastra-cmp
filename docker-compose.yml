services:
  # PostgreSQL Database
  postgres:
    image: postgres:17-alpine
    container_name: ${CONTAINER_PREFIX:-orcastra-dashboard}-postgres
    restart: always
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - orcastra-dashboard
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Redis Cache
  redis:
    image: redis:8-alpine
    container_name: ${CONTAINER_PREFIX:-dev-orcastra-dashboard}-redis
    restart: always
    ports:
      - "${REDIS_PORT:-6381}:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - orcastra-dashboard
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    volumes:
      - redis-data:/data

  # Backend API (api.orcastra.io)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        - APP_VERSION=${APP_VERSION:-latest}
    image: ${CONTAINER_PREFIX:-dev-orcastra-dashboard}-backend:${APP_VERSION:-latest}
    container_name: ${CONTAINER_PREFIX:-dev-orcastra-dashboard}-backend
    restart: always
    ports:
      - "${BACKEND_PORT:-4050}:4050"
    env_file:
      - .env
    environment:
      - APP_VERSION=${APP_VERSION:-latest}
      - API_VERSION=${API_VERSION:-latest}
      - DEBUG=${DEBUG:-false}
      - DATABASE_URL=${DATABASE_URL}

      # JWT validation
      - AUTH_ENABLED=${AUTH_ENABLED:-true}
      - AUTHENTIK_ISSUER=${AUTHENTIK_ISSUER}
      - AUTHENTIK_AUDIENCE=${AUTHENTIK_CLIENT_ID}

      # Authentik Admin API (push role groups)
      - AUTHENTIK_API_URL=${AUTHENTIK_API_URL:-}
      - AUTHENTIK_API_TOKEN=${AUTHENTIK_API_TOKEN:-}

      # Domain for PKI certificates
      - ORCASTRA_DOMAIN=${ORCASTRA_DOMAIN:-orcastra.io}

      # OpenSearch Archive (optional - for log archive management API)
      - OPENSEARCH_ARCHIVE_ENABLED=${OPENSEARCH_ARCHIVE_ENABLED:-false}
      - OPENSEARCH_URL=${OPENSEARCH_URL:-}
      - OPENSEARCH_ADMIN_USER=${OPENSEARCH_ADMIN_USER:-admin}
      - OPENSEARCH_ADMIN_PASSWORD=${OPENSEARCH_ADMIN_PASSWORD:-}
      - OPENSEARCH_SSL_VERIFY=${OPENSEARCH_SSL_VERIFY:-false}
      - OPENSEARCH_SNAPSHOT_REPO=${OPENSEARCH_SNAPSHOT_REPO:-orcastra-archive}

    volumes:
      - ./config:/app/config:rw
    networks:
      - orcastra-dashboard
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    # Resource limits — ensures Dashboard Host shows container resources, not the host
    mem_limit: ${BACKEND_MEM_LIMIT:-2g}
    cpus: ${BACKEND_CPUS:-2}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4050/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

    # Security hardening
    security_opt:
      - no-new-privileges:true
    read_only: false
    tmpfs:
      - /tmp:mode=1777,size=${BACKEND_TMPFS_SIZE:-256m}

  # Frontend (app.orcastra.io)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - NEXT_PUBLIC_AUTHENTIK_LOGOUT_URL=${NEXT_PUBLIC_AUTHENTIK_LOGOUT_URL}
        - APP_VERSION=${APP_VERSION:-latest}
        - AUTHENTIK_ISSUER=${AUTHENTIK_ISSUER}
        - AUTHENTIK_CLIENT_ID=${AUTHENTIK_CLIENT_ID}
        # NOTE: AUTHENTIK_CLIENT_SECRET and NEXTAUTH_SECRET are injected at
        # runtime via environment: block - never bake secrets into image layers
    image: ${CONTAINER_PREFIX:-dev-orcastra-dashboard}-frontend:${APP_VERSION:-latest}
    container_name: ${CONTAINER_PREFIX:-dev-orcastra-dashboard}-frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-2025}:2025"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_AUTHENTIK_LOGOUT_URL=${NEXT_PUBLIC_AUTHENTIK_LOGOUT_URL}
      - FORWARD_CLIENT_IP_HEADERS=${FORWARD_CLIENT_IP_HEADERS:-true}
      - TRUSTED_CLIENT_IP_HEADERS=${TRUSTED_CLIENT_IP_HEADERS:-cf-connecting-ip,true-client-ip,cf-connecting-ipv6,x-forwarded-for,x-real-ip}
      # Internal Docker URL for server-side API proxying
      - INTERNAL_BACKEND_URL=http://backend:4050

      # Auth.js runtime
      - AUTHENTIK_ISSUER=${AUTHENTIK_ISSUER}
      - AUTHENTIK_CLIENT_ID=${AUTHENTIK_CLIENT_ID}
      - AUTHENTIK_CLIENT_SECRET=${AUTHENTIK_CLIENT_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - AUTH_TRUST_HOST=true

    networks:
      - orcastra-dashboard
    extra_hosts:
      - "auth.orca.id:103.28.148.247"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:2025"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Fluent Bit Log Collector (Sidecar)
  # Runs alongside application to collect and ship logs to OpenSearch
  fluent-bit:
    image: fluent/fluent-bit:4.2.2-debug
    container_name: ${CONTAINER_PREFIX:-orcastra-dashboard}-fluent-bit
    restart: always
    volumes:
      - ./config/fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./config/fluent-bit/parsers.conf:/fluent-bit/etc/parsers.conf:ro
      - ./config/fluent-bit/parse_json.lua:/fluent-bit/etc/parse_json.lua:ro
      - fluent-bit-data:/fluent-bit/data
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/log/containers:/var/log/containers:ro
    environment:
      # OpenSearch connection (deployed on orcastra-logging VM)
      - OPENSEARCH_HOST=${OPENSEARCH_HOST:?OPENSEARCH_HOST is required}
      - OPENSEARCH_PORT=${OPENSEARCH_PORT:-9200}
      - OPENSEARCH_USER=${OPENSEARCH_USER:-fluentbit}
      - OPENSEARCH_PASSWORD=${OPENSEARCH_PASSWORD:?OPENSEARCH_PASSWORD is required}
    networks:
      - orcastra-dashboard
    depends_on:
      - backend
      - frontend
    healthcheck:
      # -debug image includes curl for proper HTTP health check
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:2020/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    # Optional: Enable log driver forwarding (alternative to volume mount)
    # logging:
    #   driver: fluentd
    #   options:
    #     fluentd-address: localhost:24224
    #     tag: orcastra.fluent-bit

networks:
  orcastra-dashboard:
    driver: bridge

volumes:
  redis-data:
  postgres-data:
  fluent-bit-data:
