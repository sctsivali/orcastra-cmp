---
_meta:
  type: "config"
  config_version: 2
config:
  dynamic:
    http:
      anonymous_auth_enabled: false
      xff:
        enabled: false
    authc:
      # Service accounts (Fluent Bit writers, kibanaserver) and the break-glass admin.
      # challenge=false: no browser basic-auth popup; Dashboards renders its own login form.
      # note: no auth_failure_listeners on purpose. A username lockout would let anyone on the
      # public login form lock out the Fluent Bit writer accounts (ingest outage), and IP-based
      # limiting sees every Dashboards login as the Dashboards container IP. Rate-limit
      # /auth/login at Cloudflare instead (docs/runbook.md).
      basic_internal_auth_domain:
        description: "HTTP Basic against the internal users database"
        http_enabled: true
        transport_enabled: true
        order: 0
        http_authenticator:
          type: "basic"
          challenge: false
        authentication_backend:
          type: "intern"
      # Human users via Authentik (sso.orcastra.io). Dashboards sends the id_token as a Bearer token.
      openid_auth_domain:
        description: "OpenID Connect via Authentik"
        http_enabled: true
        transport_enabled: false
        order: 1
        http_authenticator:
          type: "openid"
          challenge: false
          config:
            subject_key: "preferred_username"
            roles_key: "groups"
            openid_connect_url: "https://sso.orcastra.io/application/o/opensearch-dashboards/.well-known/openid-configuration"
            # Every Authentik provider here signs with the same key, so a signature check alone would
            # accept a token minted for any other app. Bind tokens to this provider and client.
            required_issuer: "https://sso.orcastra.io/application/o/opensearch-dashboards/"
            required_audience: "bdyS0nrQ5jI2nCbgIWViLzwwpazxUy1iP5pPKZYq"
            jwt_clock_skew_tolerance_seconds: 30
            # note: no openid_connect_idp block. Its enable_ssl switches to a custom truststore (for a
            # private-CA IdP); Authentik is served with a public certificate, so the JVM trust store
            # is the right one and setting enable_ssl breaks key retrieval.
        authentication_backend:
          type: "noop"
