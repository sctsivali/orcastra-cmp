# Generic Docker log shipper: every json-file container on this host -> central OpenSearch.
# No change to the application containers (their log driver stays json-file).
# Values come from the environment (.env next to docker-compose.yml, see .env.example).

[SERVICE]
    flush             5
    log_level         info
    parsers_file      parsers.conf
    storage.path      /buffer/storage
    storage.sync      normal
    storage.backlog.mem_limit 16MB
    storage.max_chunks_up 16
    http_server       on
    http_listen       127.0.0.1
    http_port         2020
    health_check      on

[INPUT]
    name              tail
    path              /var/lib/docker/containers/*/*-json.log
    tag               docker.*
    # Joins lines Docker split at 16 KB back into one record before parsing.
    docker_mode       on
    docker_mode_flush 5
    parser            docker
    # Offsets survive restarts, so nothing is shipped twice or skipped.
    db                /buffer/tail.db
    db.locking        true
    # Start at the end of existing files: history before onboarding stays in `docker logs`.
    read_from_head    false
    refresh_interval  10
    rotate_wait       30
    buffer_chunk_size 64KB
    buffer_max_size   1MB
    skip_long_lines   off
    storage.type      filesystem

[FILTER]
    name              lua
    match             docker.*
    script            docker-metadata.lua
    call              add_docker_metadata

[FILTER]
    name              record_modifier
    match             docker.*
    record            host ${SHIPPER_HOST}

[OUTPUT]
    name              opensearch
    match             docker.*
    host              ${OPENSEARCH_HOST}
    port              ${OPENSEARCH_PORT}
    tls               on
    tls.verify        on
    tls.ca_file       /fluent-bit/etc/ca.pem
    http_user         ${OPENSEARCH_USER}
    http_passwd       ${OPENSEARCH_PASSWORD}
    # Daily names are routed to monthly indices by the logging host.
    logstash_format   on
    logstash_prefix   containers-${SHIPPER_STACK}-${SHIPPER_ENV}
    logstash_dateformat %Y.%m.%d
    suppress_type_name on
    # Deterministic _id: a retried chunk overwrites instead of duplicating.
    generate_id       on
    trace_error       on
    buffer_size       512KB
    retry_limit       no_limits
    storage.total_limit_size 1G
