# Break-glass Dashboards: basic auth only, loopback only, started on demand (compose profile
# "breakglass"). Use when Authentik is unreachable. Same keystore as the main instance.
server.host: "0.0.0.0"
server.port: 5601
server.name: "orcastra-dashboards-breakglass"

opensearch.hosts: ["https://opensearch:9200"]
opensearch.ssl.verificationMode: full
opensearch.ssl.certificateAuthorities: ["/usr/share/opensearch-dashboards/config/certs/root-ca.pem"]
opensearch.username: "kibanaserver"
opensearch.requestHeadersAllowlist: ["authorization", "securitytenant"]

opensearch_security.auth.type: "basicauth"
# Reached over an SSH tunnel on http://localhost, so the cookie cannot require https.
opensearch_security.cookie.secure: false
opensearch_security.multitenancy.enabled: true
opensearch_security.multitenancy.tenants.preferred: ["Global", "Private"]
opensearch_security.readonly_mode.roles: ["logs_readonly_ui"]
logging.dest: stdout
logging.quiet: true
