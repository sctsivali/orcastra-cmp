# OpenSearch Dashboards for logs.orcastra.io.
# Secrets come from the keystore (scripts/dashboards-keystore.sh):
#   opensearch.password, opensearch_security.openid.client_secret, opensearch_security.cookie.password
server.host: "0.0.0.0"
server.port: 5601
server.name: "orcastra-dashboards"
server.customResponseHeaders:
  X-Content-Type-Options: "nosniff"
  X-Frame-Options: "SAMEORIGIN"
  Referrer-Policy: "strict-origin-when-cross-origin"
  Strict-Transport-Security: "max-age=31536000"

opensearch.hosts: ["https://opensearch:9200"]
opensearch.ssl.verificationMode: full
opensearch.ssl.certificateAuthorities: ["/usr/share/opensearch-dashboards/config/certs/root-ca.pem"]
opensearch.username: "kibanaserver"
opensearch.requestHeadersAllowlist: ["authorization", "securitytenant"]

# Authentik SSO for people, basic auth kept for the break-glass admin.
opensearch_security.auth.type: ["openid", "basicauth"]
opensearch_security.auth.multiple_auth_enabled: true
opensearch_security.openid.connect_url: "https://sso.orcastra.io/application/o/opensearch-dashboards/.well-known/openid-configuration"
opensearch_security.openid.client_id: "bdyS0nrQ5jI2nCbgIWViLzwwpazxUy1iP5pPKZYq"
opensearch_security.openid.scope: "openid profile email offline_access"
# Fixed public URL: Cloudflare terminates TLS, so the request Dashboards sees is plain http.
opensearch_security.openid.base_redirect_url: "https://logs.orcastra.io"
opensearch_security.openid.logout_url: "https://sso.orcastra.io/application/o/opensearch-dashboards/end-session/"
opensearch_security.openid.refresh_tokens: true
opensearch_security.openid.verify_hostnames: true
opensearch_security.ui.openid.login.buttonname: "Log in with Orcastra SSO"
opensearch_security.ui.basicauth.login.title: "Break-glass login (admin only)"

opensearch_security.cookie.secure: true
opensearch_security.cookie.isSameSite: "Lax"
opensearch_security.session.ttl: 28800000
opensearch_security.session.keepalive: true

opensearch_security.multitenancy.enabled: true
opensearch_security.multitenancy.tenants.preferred: ["Global", "Private"]
opensearch_security.readonly_mode.roles: ["logs_readonly_ui"]

logging.dest: stdout
# Health probes hit /api/status every 30s; do not log every response.
logging.quiet: true
