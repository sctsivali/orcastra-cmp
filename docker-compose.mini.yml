# Orcastra Dashboard - MINI single-instance deployment.
#
# One host runs everything: Vault + Dashboard (postgres, redis, backend, frontend) behind
# an nginx that terminates TLS and requests client certificates. No Authentik, no
# OpenSearch/Fluent Bit. Authentication is client-certificate (AUTH_MODE=client-cert);
# audit logs persist to Postgres.
#
# Usage:  cp .env.mini .env  (then fill secrets)  &&  make up-mini
# Only nginx (443) is published. The backend is NOT exposed to the host.

services:
  postgres:
    image: postgres:17-alpine
    container_name: ${CONTAINER_PREFIX:-orcastra-mini}-postgres
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - orcastra-mini
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8-alpine
    container_name: ${CONTAINER_PREFIX:-orcastra-mini}-redis
    restart: always
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - orcastra-mini
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    volumes:
      - redis-data:/data

  # HashiCorp Vault (PKI for LXD cluster certs AND user client certs).
  # Production mode + raft storage. Sealed on start: run `make vault-init-mini` then
  # `vault operator unseal` after every restart (manual unseal by design).
  vault:
    image: hashicorp/vault:1.17
    container_name: ${CONTAINER_PREFIX:-orcastra-mini}-vault
    restart: always
    # Start as root only long enough to fix named-volume ownership, then the image's
    # entrypoint drops to the unprivileged vault user (uid 100) via su-exec. Without this
    # the raft store fails with "permission denied" on /vault/data/vault.db.
    user: root
    entrypoint: ["sh", "-c", "chown -R 100:1000 /vault/data && exec docker-entrypoint.sh server"]
    cap_add:
      - IPC_LOCK
    ports:
      - "127.0.0.1:8200:8200"  # local-only admin access for init/unseal
    volumes:
      - vault-data:/vault/data
      - ./config/vault/vault.hcl:/vault/config/vault.hcl:ro
    networks:
      - orcastra-mini

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        - APP_VERSION=${APP_VERSION:-1.0.0-RC1}
    image: ${CONTAINER_PREFIX:-orcastra-mini}-backend:${APP_VERSION:-1.0.0-RC1}
    container_name: ${CONTAINER_PREFIX:-orcastra-mini}-backend
    restart: always
    # mini is single-instance: run ONE uvicorn worker so the in-process SPICE
    # session manager can collapse a console's four channels onto ONE LXD console
    # operation (matching the native LXD-UI). With multiple workers the channels
    # land on different processes and each creates its own operation. The console
    # hot path is async I/O and heavy LXD calls are offloaded to threadpools, so a
    # single worker scales fine for a compact deployment.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "4050", "--workers", "${BACKEND_WORKERS:-1}", "--ws-per-message-deflate", "false"]
    # SECURITY: no host port. The backend is reachable only on the Docker network
    # (via the frontend). Exposing it would let anyone forge X-SSL-* cert headers.
    env_file:
      - .env
    environment:
      - APP_VERSION=${APP_VERSION:-1.0.0-RC1}
      - DEBUG=${DEBUG:-false}
      - DATABASE_URL=${DATABASE_URL}

      # Client-certificate authentication
      - AUTH_ENABLED=true
      - AUTH_MODE=client-cert
      - LOCAL_JWT_SECRET=${LOCAL_JWT_SECRET:?LOCAL_JWT_SECRET is required}
      - LOCAL_JWT_TTL_SECONDS=${LOCAL_JWT_TTL_SECONDS:-900}
      - BOOTSTRAP_ADMIN_TOKEN=${BOOTSTRAP_ADMIN_TOKEN:-}
      - AUTH_PROXY_SECRET=${AUTH_PROXY_SECRET:?AUTH_PROXY_SECRET is required}
      - TRUSTED_AUTH_PROXY_CIDRS=${TRUSTED_AUTH_PROXY_CIDRS:-}
      - CLIENT_CERT_TTL_DAYS=${CLIENT_CERT_TTL_DAYS:-365}

      # Audit log to Postgres (no OpenSearch)
      - AUDIT_DB_ENABLED=true

      # Vault (required in the mini build)
      - VAULT_ENABLED=true
      - VAULT_ADDR=${VAULT_ADDR:-http://vault:8200}
      - VAULT_TOKEN=${VAULT_TOKEN}
      - VAULT_PKI_ROLE=${VAULT_PKI_ROLE:-lxd}

      - ORCASTRA_DOMAIN=${ORCASTRA_DOMAIN:-orcastra.io}
      - SECRET_KEY=${SECRET_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS}
    volumes:
      - ./config:/app/config:rw
      - /var/orcastra/uploads:/app/uploads:rw
    networks:
      - orcastra-mini
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      vault:
        condition: service_started
    mem_limit: ${BACKEND_MEM_LIMIT:-2g}
    cpus: ${BACKEND_CPUS:-2}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4050/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:mode=1777,size=${BACKEND_TMPFS_SIZE:-256m}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - APP_VERSION=${APP_VERSION:-1.0.0-RC1}
        # Baked at build time - the client bundle must compile in client-cert mode.
        - NEXT_PUBLIC_AUTH_MODE=client-cert
    image: ${CONTAINER_PREFIX:-orcastra-mini}-frontend:${APP_VERSION:-1.0.0-RC1}
    container_name: ${CONTAINER_PREFIX:-orcastra-mini}-frontend
    restart: always
    # No host port - only nginx talks to the frontend.
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_AUTH_MODE=client-cert
      - INTERNAL_BACKEND_URL=http://backend:4050
      - FORWARD_CLIENT_IP_HEADERS=${FORWARD_CLIENT_IP_HEADERS:-true}

      # Auth.js + client-cert login bridge
      - AUTH_MODE=client-cert
      - AUTH_PROXY_SECRET=${AUTH_PROXY_SECRET:?AUTH_PROXY_SECRET is required}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - AUTH_TRUST_HOST=true
    networks:
      - orcastra-mini
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:2025"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # nginx: terminates TLS, requests the client cert (trust-on-first-use), forwards the
  # verified cert to the frontend as X-SSL-* headers. The only publicly exposed service.
  nginx:
    image: nginx:1.27-alpine
    container_name: ${CONTAINER_PREFIX:-orcastra-mini}-nginx
    restart: always
    ports:
      - "${HTTPS_PORT:-443}:443"
    environment:
      # Injected into the cert-login location; NGINX_ENVSUBST_FILTER limits substitution to
      # this one var so nginx runtime vars ($ssl_*, $host, ...) are left intact.
      - AUTH_PROXY_SECRET=${AUTH_PROXY_SECRET:?AUTH_PROXY_SECRET is required}
      - NGINX_ENVSUBST_FILTER=^AUTH_PROXY_SECRET$$
    volumes:
      - ./config/nginx/mini.conf:/etc/nginx/templates/default.conf.template:ro
      - ./config/nginx/certs:/etc/nginx/certs:ro
    networks:
      - orcastra-mini
    depends_on:
      - frontend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--no-check-certificate", "--spider", "https://127.0.0.1:443"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  orcastra-mini:
    driver: bridge

volumes:
  redis-data:
  postgres-data:
  vault-data:
